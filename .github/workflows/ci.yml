name: Task Manager CI

on:
  push:
  pull_request:

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: task_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d task_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/task_manager_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @task-manager/api db:generate

      - name: Apply database migrations
        run: pnpm --filter @task-manager/api exec prisma migrate deploy --config prisma7.config.ts

      - name: Run ESLint
        run: pnpm lint

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Run API tests
        run: pnpm test

      - name: Build API
        run: pnpm build

      - name: Lint frontend
        run: pnpm --filter web lint

      - name: Build frontend
        run: pnpm --filter web build
